services:
  ml-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    ipc: host
    volumes:
      - ../:/workspace
      - /opt/steel-defect-data:/opt/steel-defect-data
    working_dir: /workspace
    tty: true
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////opt/steel-defect-data/mlflow/mlflow.db